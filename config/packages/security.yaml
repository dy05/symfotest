security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            id: App\Security\AppUserProvider
#            entity:
#                class: App\Entity\User
#                property: id

#        user_jwt_provider:
#            entity:
#                class: App\Entity\User
#                property: id
#        jwt:
#            lexik_jwt:
#                class: App\Entity\User
    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            pattern: ^/(?!api) # ✅ exclude /api entirely — let the api firewall handle it
            lazy: true
#            stateless: false
            provider: app_user_provider
            custom_authenticator: App\Security\AppAuthenticator
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

            json_login:
                check_path: /login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api_with_key:
            pattern: ^/api/custom
            provider: app_user_provider
            custom_authenticator: App\Security\AppKeyAuthenticator
#            json_login:
#                check_path: /api/custom/login
#            logout:
#                path: /api/custom/logout

        api_cookie:
            pattern: ^/api/auth
            provider: app_user_provider
            jwt: ~
#            jwt:
#                provider: user_jwt_provider
##                authenticator: app.jwt
            context: main          # <-- shares the same session/token as "main"
            json_login:
                check_path: /api/auth/login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            logout:
                path: /api/auth/logout

        api:
            pattern: ^/api/
            stateless: true
            provider: app_user_provider
            entry_point: jwt
#            provider: jwt
            jwt: ~
#            jwt:
#                provider: user_jwt_provider
##                authenticator: app.jwt
            refresh_jwt:
                check_path: /api/token/refresh # or, you may use the `api_refresh_token` route name
                # or if you have more than one user provider
                provider: app_user_provider

            json_login:
                check_path:  /api/login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure


    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/(login|token/refresh), roles: PUBLIC_ACCESS }
#        - { path: ^/$, roles: PUBLIC_ACCESS } # Allows accessing the Swagger UI
#        - { path: ^/docs, roles: PUBLIC_ACCESS } # Allows accessing the Swagger UI docs
#        - { path: ^/contexts, roles: PUBLIC_ACCESS } # Allows accessing the Swagger UI contexts
#        - { path: ^/auth, roles: PUBLIC_ACCESS }
#        - { path: ^/, roles: IS_AUTHENTICATED_FULLY
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

